[package]
  name    = "devkit-poe-complete"
  version = "1.1.0"
  edition = "2024"
  publish = false

[lib]
  name = "devkit_poe_complete"

[[bin]]
  name = "devkit-complete"
  path = "src/main.rs"

[dependencies]
  anyhow      = "1.0.104"
  clap        = { version = "4", features = ["derive"] }
  serde       = { version = "1.0.229", features = ["derive"] }
  serde_json  = { version = "1.0.151", features = ["preserve_order"] }
  shell-words = "1.1.0"
  toml_edit   = "0.25.13"

[dev-dependencies]
  tempfile = "3.27.0"

[profile.release]
  strip       = true
  incremental = true
